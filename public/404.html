<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/Tracker/" />
  </head>
  <body>
    <script>
      var redirect = location.pathname.replace("/Tracker", "");
      window.location.replace("/Tracker/" + redirect);
    </script>
  </body>
</html>
