<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all requests to index.html (SPA support)
      var redirectTo = "/Tracker/";
      // Keep subpath (so /about → /Tracker/about)
      if (location.pathname.length > 0) {
        var path = location.pathname.replace("/Tracker", "");
        redirectTo += path;
      }
      location.replace(redirectTo);
    </script>
  </head>
  <body></body>
</html>
